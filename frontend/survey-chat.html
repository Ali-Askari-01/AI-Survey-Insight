<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interview — InsightAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --gold: #F5A623; --gold-hover: #E09000; --gold-light: rgba(245,166,35,0.08);
            --cream: #FAF7F2; --cream-dark: #F0EBE3; --card-bg: #FFFFFF;
            --success: #22c55e; --warning: #f59e0b; --danger: #ef4444; --info: #3b82f6;
            --text-dark: #1A1A2E; --text-body: #374151; --text-muted: #6B7280;
            --border: #E5E0D8; --radius-lg: 12px; --radius-xl: 16px;
            --shadow-lg: 0 10px 30px rgba(26,26,46,0.1);
        }
        body {
            font-family: 'DM Sans', system-ui, sans-serif; background: var(--cream);
            height: 100vh; display: flex; flex-direction: column; justify-content: center;
            padding: 20px; color: var(--text-dark);
        }
        
        .container { max-width: 900px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }
        .chat-card {
            background: var(--card-bg); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);
            border: 1px solid var(--border); height: 100%; display: flex; flex-Direction: column;
            overflow: hidden;
        }
        
        /* Header */
        .chat-header {
            background: linear-gradient(135deg, var(--gold) 0%, #E09000 100%);
            padding: 20px 24px; color: var(--text-dark); display: flex;
            align-items: center; justify-content: space-between; flex-shrink: 0;
        }
        .chat-title { font-size: 1.3rem; font-weight: 700; }
        .chat-status { font-size: 0.85rem; opacity: 0.8; }
        
        /* Progress */
        .progress-header { 
            background: var(--cream); padding: 12px 24px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }
        .progress-bar { flex: 1; height: 6px; background: var(--cream-dark); border-radius: 3px; margin-right: 16px; }
        .progress-fill { height: 100%; background: var(--gold); border-radius: 3px; transition: width 0.5s ease; }
        .progress-text { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; white-space: nowrap; }
        
        /* Messages */
        .messages-container { 
            flex: 1; overflow-y: auto; padding: 24px; 
            display: flex; flex-direction: column; gap: 16px;
            background: var(--cream);
        }
        
        .message {
            max-width: 75%; padding: 16px 20px; border-radius: var(--radius-lg); 
            font-size: 1rem; line-height: 1.5; animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .message-ai {
            align-self: flex-start; background: var(--card-bg); 
            border: 1px solid var(--border); border-bottom-left-radius: 6px;
            box-shadow: 0 2px 8px rgba(26,26,46,0.06);
        }
        .message-user {
            align-self: flex-end; background: var(--gold); color: var(--text-dark);
            border-bottom-right-radius: 6px; font-weight: 500;
        }
        
        .message-avatar {
            width: 32px; height: 32px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 0.9rem;
            margin-bottom: 8px; font-weight: 600;
        }
        .message-ai .message-avatar { background: var(--gold-light); color: var(--gold); }
        .message-user .message-avatar { background: rgba(255,255,255,0.2); color: var(--text-dark); }
        
        .typing-indicator {
            padding: 12px 20px; background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius-lg); align-self: flex-start; display: none;
        }
        .typing-dots {
            display: flex; gap: 4px;
        }
        .typing-dot {
            width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted);
            animation: typing 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 80%, 100% { opacity: 0.3; transform: scale(1); } 40% { opacity: 1; transform: scale(1.2); } }
        
        /* Input Area */
        .input-container {
            background: var(--card-bg); border-top: 1px solid var(--border);
            padding: 20px 24px; flex-shrink: 0;
        }
        
        .voice-controls {
            display: flex; justify-content: center; margin-bottom: 16px;
            background: var(--gold-light); border-radius: var(--radius-lg); padding: 12px;
        }
        .voice-btn {
            background: var(--gold); color: var(--text-dark); border: none;
            border-radius: 50%; width: 50px; height: 50px; font-size: 1.2rem;
            cursor: pointer; transition: all 0.3s ease; margin-right: 12px;
            display: flex; align-items: center; justify-content: center;
        }
        .voice-btn:hover { background: var(--gold-hover); transform: scale(1.05); }
        .voice-btn.recording { 
            background: var(--danger); animation: pulse 2s infinite;
            box-shadow: 0 0 0 4px rgba(239,68,68,0.3);
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .voice-status { 
            flex: 1; display: flex; align-items: center; font-size: 0.9rem; 
            color: var(--text-muted); font-weight: 500;
        }
        
        .input-area {
            display: flex; gap: 12px; align-items: flex-end;
        }
        .message-input {
            flex: 1; border: 2px solid var(--border); border-radius: var(--radius-lg);
            padding: 14px 16px; font-size: 1rem; font-family: inherit; resize: none;
            min-height: 50px; max-height: 120px; background: var(--card-bg);
            transition: border-color 0.2s;
        }
        .message-input:focus { outline: none; border-color: var(--gold); }
        .send-btn {
            background: var(--gold); color: var(--text-dark); border: none;
            border-radius: var(--radius-lg); padding: 14px 18px; font-size: 1.1rem;
            cursor: pointer; transition: all 0.2s; height: 50px;
            display: flex; align-items: center; justify-content: center;
        }
        .send-btn:hover { background: var(--gold-hover); }
        .send-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
        
        /* Status Messages */
        .status-banner {
            background: var(--info); color: white; padding: 8px 24px;
            text-align: center; font-size: 0.85rem; font-weight: 500; display: none;
        }
        .status-banner.success { background: var(--success); }
        .status-banner.error { background: var(--danger); }
        
        /* Completion */
        .completion-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(245,166,35,0.1); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .completion-card {
            background: var(--card-bg); border-radius: var(--radius-xl);
            padding: 60px 40px; text-align: center; box-shadow: var(--shadow-lg);
            border: 1px solid var(--border); max-width: 500px; margin: 20px;
        }
        .completion-icon { 
            font-size: 4rem; color: var(--success); margin-bottom: 24px;
            width: 100px; height: 100px; border-radius: 50%;
            border: 3px solid var(--success); display: flex;
            align-items: center; justify-content: center; margin: 0 auto 24px;
        }
        .completion-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 16px; }
        .completion-text { font-size: 1.1rem; color: var(--text-muted); line-height: 1.6; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 10px; height: calc(100vh - 20px); }
            .chat-header { padding: 16px; }
            .messages-container { padding: 16px; }
            .input-container { padding: 16px; }
            .message { max-width: 85%; }
            .voice-controls { margin-bottom: 12px; }
            .input-area { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-card">
            <div class="chat-header">
                <div>
                    <div class="chat-title"><i class="fas fa-comments"></i> Chat Interview</div>
                    <div class="chat-status" id="chat-status">Starting conversation...</div>
                </div>
                <div class="chat-status" id="time-remaining">~5 min</div>
            </div>
            
            <div class="progress-header">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>
                <div class="progress-text" id="progress-text">0% Complete</div>
            </div>
            
            <div class="status-banner" id="status-banner"></div>
            
            <div class="messages-container" id="messages-container">
                <!-- Messages will be populated here -->
                <div class="typing-indicator" id="typing-indicator">
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            </div>
            
            <div class="input-container">
                <!-- Voice Controls -->
                <div class="voice-controls">
                    <button class="voice-btn" id="voice-btn" onclick="toggleRecording()">
                        <i class="fas fa-microphone" id="voice-icon"></i>
                    </button>
                    <div class="voice-status" id="voice-status">
                        <i class="fas fa-info-circle" style="margin-right: 8px;"></i>
                        Click microphone to speak your response
                    </div>
                </div>
                
                <!-- Text Input -->
                <div class="input-area">
                    <textarea class="message-input" id="message-input" 
                              placeholder="Type your response here..." maxlength="1000"></textarea>
                    <button class="send-btn" id="send-btn" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Completion Overlay -->
    <div class="completion-overlay" id="completion-overlay">
        <div class="completion-card">
            <div class="completion-icon">
                <i class="fas fa-check"></i>
            </div>
            <h2 class="completion-title">Interview Complete!</h2>
            <p class="completion-text">
                Thank you for sharing your insights. Your responses help us understand your experience better.
            </p>
        </div>
    </div>

    <script>
        let sessionId = null;
        let surveyId = null;
        let previousMessages = [];
        let totalQuestions = 0;
        let currentProgress = 0;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let conversationStarted = false;
        let resolvedSurveyId = null;

        // Initialize chat
        async function initChat() {
            const urlParams = new URLSearchParams(window.location.search);
            surveyId = urlParams.get('survey_id') || urlParams.get('share_code');
            if (surveyId === 'demo') surveyId = '1';
            
            if (!surveyId) {
                showStatus('error', 'Invalid survey link. Please check the URL.');
                return;
            }
            
            try {
                // Resolve both numeric survey IDs and published share codes
                const publishedResponse = await fetch(`/api/publish/s/${encodeURIComponent(surveyId)}`);
                if (publishedResponse.ok) {
                    const publishedData = await publishedResponse.json();
                    resolvedSurveyId = publishedData.survey_id;
                    if (publishedData.title) {
                        document.querySelector('.chat-header h1').textContent = publishedData.title;
                    }
                } else {
                    const surveyResponse = await fetch(`/api/surveys/${encodeURIComponent(surveyId)}`);
                    if (!surveyResponse.ok) {
                        throw new Error('Survey not found');
                    }
                    const surveyData = await surveyResponse.json();
                    resolvedSurveyId = surveyData.id || parseInt(surveyId, 10) || 1;
                    if (surveyData.title) {
                        document.querySelector('.chat-header h1').textContent = surveyData.title;
                    }
                }

                // Create session
                const sessionResponse = await fetch('/api/interviews/sessions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        survey_id: resolvedSurveyId,
                        channel: 'chat',
                        device_type: detectDevice(),
                        language: 'en'
                    })
                });
                
                const sessionData = await sessionResponse.json();
                sessionId = sessionData.session_id;
                totalQuestions = sessionData.total_questions || 5;
                
                // Show intro message
                if (sessionData.intro_message) {
                    addMessage('ai', sessionData.intro_message);
                }
                
                document.getElementById('chat-status').textContent = 'Connected';
                
            } catch (error) {
                console.error('Init error:', error);
                showStatus('error', 'Failed to start chat. Please refresh and try again.');
            }
        }
        
        function addMessage(role, text, isTyping = false) {
            const messagesContainer = document.getElementById('messages-container');
            const typingIndicator = document.getElementById('typing-indicator');
            
            if (isTyping) {
                typingIndicator.style.display = 'block';
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                return;
            }
            
            // Hide typing indicator
            typingIndicator.style.display = 'none';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${role}`;
            
            if (role === 'ai') {
                messageDiv.innerHTML = `
                    <div class="message-avatar"><i class="fas fa-robot"></i></div>
                    ${text}
                `;
            } else {
                messageDiv.innerHTML = text;
            }
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            // Update progress for user messages
            if (role === 'user') {
                currentProgress++;
                updateProgress();
            }
        }
        
        function updateProgress() {
            const progress = (currentProgress / totalQuestions) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('progress-text').textContent = `${Math.round(progress)}% Complete`;
        }
        
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            
            if (!text) return;
            
            if (!conversationStarted) {
                conversationStarted = true;
                // Send start signal first
                await sendChatMessage('__START__', 'system');
            }
            
            // Add user message
            addMessage('user', text);
            input.value = '';
            
            // Show typing indicator
            addMessage('ai', '', true);
            
            try {
                // Send message using fast chat endpoint
                const response = await fetch('/api/interviews/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        message: text,
                        message_type: 'text'
                    })
                });
                
                const result = await response.json();
                
                // Add AI response
                if (result.ai_response) {
                    addMessage('ai', result.ai_response);
                }
                
                // Check if interview is complete
                if (result.is_complete || currentProgress >= totalQuestions) {
                    setTimeout(() => showCompletion(), 1000);
                }
                
            } catch (error) {
                console.error('Send error:', error);
                addMessage('ai', 'Sorry, I had trouble processing that. Could you try again?');
            }
        }
        
        async function sendChatMessage(message, type = 'text') {
            return fetch('/api/interviews/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_id: sessionId,
                    message: message,
                    message_type: type
                })
            });
        }
        
        // Voice Recording
        async function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }
        
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    await transcribeAudio(audioBlob);
                };
                
                mediaRecorder.start();
                isRecording = true;
                
                // Update UI
                const btn = document.getElementById('voice-btn');
                const icon = document.getElementById('voice-icon');
                const status = document.getElementById('voice-status');
                
                btn.classList.add('recording');
                icon.className = 'fas fa-stop';
                status.innerHTML = '<i class="fas fa-circle" style="color: #ef4444; margin-right: 8px;"></i>Recording... Click to stop';
                
            } catch (error) {
                console.error('Recording error:', error);
                showStatus('error', 'Could not access microphone. Please check permissions.');
            }
        }
        
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            
            isRecording = false;
            
            // Update UI
            const btn = document.getElementById('voice-btn');
            const icon = document.getElementById('voice-icon');
            const status = document.getElementById('voice-status');
            
            btn.classList.remove('recording');
            icon.className = 'fas fa-microphone';
            status.innerHTML = '<i class="fas fa-cog fa-spin" style="margin-right: 8px;"></i>Processing audio...';
        }
        
        async function transcribeAudio(audioBlob) {
            try {
                const formData = new FormData();
                formData.append('audio_file', audioBlob, 'recording.wav');
                
                const response = await fetch('/api/fast-interview/transcribe-audio', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const messageInput = document.getElementById('message-input');
                    messageInput.value = result.text;
                    document.getElementById('voice-status').innerHTML = '<i class="fas fa-check" style="color: #22c55e; margin-right: 8px;"></i>Voice input ready to send!';
                    showStatus('success', 'Voice input transcribed successfully!');
                } else {
                    throw new Error('Transcription failed');
                }
                
            } catch (error) {
                console.error('Transcription error:', error);
                document.getElementById('voice-status').innerHTML = '<i class="fas fa-info-circle" style="margin-right: 8px;"></i>Click microphone to speak your response';
                showStatus('error', 'Could not transcribe audio. Please try typing instead.');
            }
        }
        
        function showCompletion() {
            document.getElementById('completion-overlay').style.display = 'flex';
            
            // Show experience feedback widget after 2 seconds
            setTimeout(() => {
                showExperienceWidget();
            }, 2000);
        }

        // ═══════════════════════════════════════════════════════════════
        // EXPERIENCE FEEDBACK WIDGET (30-second max for respondents)
        // ═══════════════════════════════════════════════════════════════
        
        function showExperienceWidget() {
            if (document.getElementById('experienceWidget')) return; // Already shown
            
            const feedbackSessionId = sessionId || ('session_' + Date.now());
            const feedbackSurveyId = resolvedSurveyId || parseInt(surveyId, 10) || 1;
            
            const widgetHTML = `
                <div class="experience-widget" id="experienceWidget" style="
                    position: fixed; bottom: 20px; right: 20px; background: white;
                    border: 1px solid var(--border); border-radius: var(--radius-xl);
                    padding: 20px; width: 280px; max-width: calc(100vw - 40px);
                    box-shadow: var(--shadow-lg); z-index: 9999;
                    transform: translateX(320px); transition: transform 0.3s ease;
                ">
                    <h4 style="margin: 0 0 12px; color: var(--text-dark); font-size: 0.95rem;">
                        How was your chat experience? 
                        <span style="font-size: 0.75rem; color: var(--text-muted);">(30 sec)</span>
                    </h4>
                    
                    <div style="display: flex; justify-content: space-between; margin-bottom: 12px;" id="quickRating">
                        <button class="quick-rating-btn" data-rating="1" style="
                            background: var(--cream); border: 1px solid var(--border); border-radius: 50%;
                            width: 32px; height: 32px; cursor: pointer; transition: all 0.2s ease;
                        ">😞</button>
                        <button class="quick-rating-btn" data-rating="2" style="
                            background: var(--cream); border: 1px solid var(--border); border-radius: 50%;
                            width: 32px; height: 32px; cursor: pointer; transition: all 0.2s ease;
                        ">😐</button>
                        <button class="quick-rating-btn" data-rating="3" style="
                            background: var(--cream); border: 1px solid var(--border); border-radius: 50%;
                            width: 32px; height: 32px; cursor: pointer; transition: all 0.2s ease;
                        ">🙂</button>
                        <button class="quick-rating-btn" data-rating="4" style="
                            background: var(--cream); border: 1px solid var(--border); border-radius: 50%;
                            width: 32px; height: 32px; cursor: pointer; transition: all 0.2s ease;
                        ">😊</button>
                        <button class="quick-rating-btn" data-rating="5" style="
                            background: var(--cream); border: 1px solid var(--border); border-radius: 50%;
                            width: 32px; height: 32px; cursor: pointer; transition: all 0.2s ease;
                        ">😍</button>
                    </div>

                    <textarea id="experienceComment" placeholder="Quick feedback (optional)..." style="
                        width: 100%; background: var(--cream); border: 1px solid var(--border);
                        border-radius: 8px; padding: 8px 10px; font-family: inherit;
                        font-size: 0.8rem; resize: none; height: 50px; margin-bottom: 12px;
                    "></textarea>

                    <div style="display: flex; gap: 8px; justify-content: flex-end;">
                        <button onclick="closeExperienceWidget()" style="
                            background: transparent; border: none; color: var(--text-muted);
                            padding: 4px 8px; font-size: 0.75rem; cursor: pointer;
                        ">Skip</button>
                        <button onclick="submitExperience('${feedbackSessionId}', ${feedbackSurveyId})" style="
                            background: var(--gold); border: none; color: white;
                            padding: 6px 12px; border-radius: 6px; font-size: 0.75rem;
                            cursor: pointer; font-weight: 500;
                        ">Submit</button>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', widgetHTML);
            
            // Show widget with animation
            requestAnimationFrame(() => {
                document.getElementById('experienceWidget').style.transform = 'translateX(0)';
            });

            // Setup rating buttons
            document.querySelectorAll('.quick-rating-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.quick-rating-btn').forEach(b => {
                        b.style.background = 'var(--cream)';
                        b.style.borderColor = 'var(--border)';
                    });
                    btn.style.background = 'var(--gold)';
                    btn.style.borderColor = 'var(--gold)';
                    btn.classList.add('selected');
                });
            });

            // Auto-hide after 30 seconds
            setTimeout(closeExperienceWidget, 30000);
        }

        async function submitExperience(sessionId, surveyId) {
            const selectedRating = document.querySelector('.quick-rating-btn.selected');
            const rating = selectedRating ? parseInt(selectedRating.dataset.rating) : null;
            const comment = document.getElementById('experienceComment').value.trim();

            try {
                const response = await fetch('/api/feedback/respondent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        session_id: sessionId,
                        survey_id: parseInt(surveyId),
                        overall_rating: rating,
                        quick_feedback: comment || null,
                        completion_time: Date.now() - (window.surveyStartTime || Date.now()),
                        channel_used: 'chat'
                    })
                });

                if (response.ok) {
                    showExperienceThankYou();
                } else {
                    console.warn('Experience feedback submission failed');
                    closeExperienceWidget();
                }
            } catch (error) {
                console.error('Experience submission error:', error);
                closeExperienceWidget();
            }
        }

        function showExperienceThankYou() {
            const widget = document.getElementById('experienceWidget');
            if (widget) {
                widget.innerHTML = `
                    <div style="text-align: center; padding: 20px;">
                        <div style="color: var(--gold); font-size: 2rem; margin-bottom: 8px;">✓</div>
                        <p style="color: var(--text-dark); margin: 0; font-size: 0.9rem;">Thank you!</p>
                    </div>
                `;
                setTimeout(closeExperienceWidget, 2000);
            }
        }

        function closeExperienceWidget() {
            const widget = document.getElementById('experienceWidget');
            if (widget) {
                widget.style.transform = 'translateX(320px)';
                setTimeout(() => widget.remove(), 300);
            }
        }
        
        // Utility Functions
        function showStatus(type, message) {
            const banner = document.getElementById('status-banner');
            banner.className = `status-banner ${type}`;
            banner.textContent = message;
            banner.style.display = 'block';
            setTimeout(() => banner.style.display = 'none', 3000);
        }
        
        function detectDevice() {
            const ua = navigator.userAgent;
            if (/tablet|ipad|playbook|silk/i.test(ua)) return 'tablet';
            if (/mobile|iphone|ipod|android|blackberry|opera|mini|windows\sce|palm|smartphone|iemobile/i.test(ua)) return 'mobile';
            return 'desktop';
        }
        
        // Handle Enter key
        document.addEventListener('DOMContentLoaded', () => {
            // Track survey start time for completion duration
            window.surveyStartTime = Date.now();
            
            initChat();
            
            document.getElementById('message-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        });
    </script>
</body>
</html>
