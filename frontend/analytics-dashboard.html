<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard — InsightAI Founder Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --gold: #F5A623; --gold-hover: #E09000; --gold-light: rgba(245,166,35,0.1);
            --cream: #FAF7F2; --cream-dark: #F0EBE3; --card-bg: #FFFFFF;
            --success: #22c55e; --warning: #f59e0b; --danger: #ef4444; --info: #3b82f6;
            --text-dark: #1A1A2E; --text-body: #374151; --text-muted: #6B7280;
            --border: #E5E0D8; --radius-lg: 12px; --radius-xl: 16px;
            --shadow-lg: 0 10px 30px rgba(26,26,46,0.1);
        }

        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--cream);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .dashboard-header {
            background: linear-gradient(135deg, var(--gold) 0%, #E09000 100%);
            color: white;
            padding: 32px;
            border-radius: var(--radius-xl);
            margin-bottom: 32px;
            box-shadow: var(--shadow-lg);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header-subtitle {
            font-size: 1rem;
            opacity: 0.9;
        }

        .header-controls {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .period-selector {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 8px 16px;
            color: white;
            font-size: 0.9rem;
        }

        .refresh-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 8px 16px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }

        .refresh-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .metric-card {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }

        .metric-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .metric-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .metric-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .metric-icon.traffic { background: var(--gold-light); color: var(--gold); }
        .metric-icon.users { background: rgba(59,130,246,0.1); color: var(--info); }
        .metric-icon.surveys { background: rgba(34,197,94,0.1); color: var(--success); }
        .metric-icon.feedback { background: rgba(239,68,68,0.1); color: var(--danger); }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .metric-change {
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .metric-change.positive { color: var(--success); }
        .metric-change.negative { color: var(--danger); }
        .metric-change.neutral { color: var(--text-muted); }

        /* Charts Section */
        .charts-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }

        .chart-header {
            margin-bottom: 24px;
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .chart-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Feedback Panel */
        .feedback-panel {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .panel-header {
            background: var(--cream);
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .view-all-btn {
            background: var(--gold);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 500;
        }

        .feedback-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .feedback-item {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s ease;
        }

        .feedback-item:hover {
            background: var(--cream);
        }

        .feedback-item:last-child {
            border-bottom: none;
        }

        .feedback-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .feedback-type {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .feedback-type.bug { background: rgba(239,68,68,0.1); color: var(--danger); }
        .feedback-type.feature_request { background: rgba(59,130,246,0.1); color: var(--info); }
        .feedback-type.improvement { background: rgba(245,166,35,0.1); color: var(--gold); }
        .feedback-type.general { background: rgba(107,114,128,0.1); color: var(--text-muted); }

        .feedback-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .feedback-content {
            font-size: 0.9rem;
            color: var(--text-body);
            line-height: 1.5;
        }

        .feedback-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .feedback-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
        }

        .star-rating {
            color: var(--gold);
            font-size: 0.8rem;
        }

        /* Loading States */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .loading i {
            font-size: 2rem;
            animation: spin 2s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .charts-section {
                grid-template-columns: 1fr;
            }
            
            .header-content {
                text-align: center;
            }
            
            .metrics-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }
            
            .dashboard-header {
                padding: 24px;
            }
            
            .header-title {
                font-size: 1.8rem;
            }
            
            .metrics-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }

        /* Status Indicators */
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .status-indicator.online {
            background: rgba(34,197,94,0.1);
            color: var(--success);
        }

        .status-indicator.warning {
            background: rgba(245,158,11,0.1);
            color: var(--warning);
        }

        .error-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .error-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            color: var(--danger);
        }

        .retry-btn {
            background: var(--gold);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 500;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Dashboard Header -->
        <div class="dashboard-header">
            <div class="header-content">
                <div>
                    <h1 class="header-title">
                        <i class="fas fa-chart-line" style="margin-right: 12px;"></i>
                        Analytics Dashboard
                    </h1>
                    <p class="header-subtitle">Founder Portal — Real-time insights into your platform</p>
                </div>
                <div class="header-controls">
                    <select class="period-selector" id="periodSelector">
                        <option value="7">Last 7 Days</option>
                        <option value="30" selected>Last 30 Days</option>
                        <option value="90">Last 90 Days</option>
                    </select>
                    <button class="refresh-btn" onclick="refreshDashboard()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>
        </div>

        <!-- Key Metrics -->
        <div class="metrics-grid" id="metricsGrid">
            <!-- Metrics will be populated by JavaScript -->
        </div>

        <!-- Charts Section -->
        <div class="charts-section">
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">Daily Traffic Trend</h3>
                    <p class="chart-subtitle">Page views and unique visitors over time</p>
                </div>
                <canvas id="trafficChart" width="400" height="200"></canvas>
            </div>

            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">Channel Performance</h3>
                    <p class="chart-subtitle">Survey responses by channel</p>
                </div>
                <canvas id="channelChart" width="200" height="200"></canvas>
            </div>
        </div>

        <!-- Feedback Panels -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
            <!-- User Feedback -->
            <div class="feedback-panel">
                <div class="panel-header">
                    <h3 class="panel-title">
                        <i class="fas fa-comment-dots" style="margin-right: 8px; color: var(--gold);"></i>
                        Recent User Feedback
                    </h3>
                    <button class="view-all-btn" onclick="viewAllFeedback()">View All</button>
                </div>
                <div class="feedback-list" id="userFeedbackList">
                    <!-- User feedback will be populated by JavaScript -->
                </div>
            </div>

            <!-- Respondent Experience -->
            <div class="feedback-panel">
                <div class="panel-header">
                    <h3 class="panel-title">
                        <i class="fas fa-smile" style="margin-right: 8px; color: var(--success);"></i>
                        Respondent Experience
                    </h3>
                    <button class="view-all-btn" onclick="viewAllExperience()">View All</button>
                </div>
                <div class="feedback-list" id="experienceFeedbackList">
                    <!-- Respondent experience will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        class AnalyticsDashboard {
            constructor() {
                this.charts = {};
                this.refreshInterval = null;
                this.currentPeriod = 30;
                
                this.init();
            }

            async init() {
                this.setupEventListeners();
                await this.loadDashboard();
                this.setupAutoRefresh();
            }

            setupEventListeners() {
                document.getElementById('periodSelector').addEventListener('change', (e) => {
                    this.currentPeriod = parseInt(e.target.value);
                    this.loadDashboard();
                });
            }

            async loadDashboard() {
                try {
                    this.showLoading();
                    
                    // Load all data
                    const [overview, userFeedback, experienceData] = await Promise.all([
                        this.fetchOverview(),
                        this.fetchUserFeedback(),
                        this.fetchExperienceData()
                    ]);

                    // Update UI
                    this.updateMetrics(overview);
                    this.updateCharts(overview);
                    this.updateUserFeedback(userFeedback);
                    this.updateExperienceData(experienceData);

                    this.hideLoading();
                } catch (error) {
                    console.error('Dashboard load failed:', error);
                    this.showError('Failed to load dashboard data');
                }
            }

            async fetchOverview() {
                const token = localStorage.getItem('token') || sessionStorage.getItem('token');
                const response = await fetch(`/api/dashboard/overview?days=${this.currentPeriod}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch overview data');
                }

                return await response.json();
            }

            async fetchUserFeedback() {
                const token = localStorage.getItem('token') || sessionStorage.getItem('token');
                const response = await fetch('/api/dashboard/user-feedback?limit=10', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch user feedback');
                }

                return await response.json();
            }

            async fetchExperienceData() {
                const token = localStorage.getItem('token') || sessionStorage.getItem('token');
                const response = await fetch(`/api/dashboard/respondent-experience?days=${this.currentPeriod}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch experience data');
                }

                return await response.json();
            }

            updateMetrics(data) {
                const metrics = [
                    {
                        title: 'Page Views',
                        value: this.formatNumber(data.traffic?.page_views || 0),
                        icon: 'fas fa-eye',
                        iconClass: 'traffic',
                        change: this.calculateChange(data.traffic?.page_views, data.traffic?.previous_page_views)
                    },
                    {
                        title: 'Active Users',
                        value: this.formatNumber(data.users?.active_users || 0),
                        icon: 'fas fa-users',
                        iconClass: 'users',
                        change: this.calculateChange(data.users?.active_users, data.users?.previous_active_users)
                    },
                    {
                        title: 'Survey Responses',
                        value: this.formatNumber(data.surveys?.responses_collected || 0),
                        icon: 'fas fa-clipboard-list',
                        iconClass: 'surveys',
                        change: this.calculateChange(data.surveys?.responses_collected, data.surveys?.previous_responses)
                    },
                    {
                        title: 'User Rating',
                        value: (data.feedback?.avg_user_rating || 0).toFixed(1) + '/5',
                        icon: 'fas fa-star',
                        iconClass: 'feedback',
                        change: this.calculateChange(data.feedback?.avg_user_rating, data.feedback?.previous_rating)
                    }
                ];

                const grid = document.getElementById('metricsGrid');
                grid.innerHTML = metrics.map(metric => `
                    <div class="metric-card">
                        <div class="metric-header">
                            <span class="metric-title">${metric.title}</span>
                            <div class="metric-icon ${metric.iconClass}">
                                <i class="${metric.icon}"></i>
                            </div>
                        </div>
                        <div class="metric-value">${metric.value}</div>
                        <div class="metric-change ${metric.change.class}">
                            <i class="fas fa-${metric.change.icon}"></i>
                            ${metric.change.text}
                        </div>
                    </div>
                `).join('');
            }

            updateCharts(data) {
                // Traffic Trend Chart
                const trafficCtx = document.getElementById('trafficChart');
                if (this.charts.traffic) {
                    this.charts.traffic.destroy();
                }

                this.charts.traffic = new Chart(trafficCtx, {
                    type: 'line',
                    data: {
                        labels: data.daily_trend?.map(d => new Date(d.date).toLocaleDateString()) || [],
                        datasets: [
                            {
                                label: 'Page Views',
                                data: data.daily_trend?.map(d => d.page_views) || [],
                                borderColor: '#F5A623',
                                backgroundColor: 'rgba(245,166,35,0.1)',
                                tension: 0.4,
                                fill: true
                            },
                            {
                                label: 'Unique Sessions',
                                data: data.daily_trend?.map(d => d.unique_sessions) || [],
                                borderColor: '#3B82F6',
                                backgroundColor: 'rgba(59,130,246,0.1)',
                                tension: 0.4,
                                fill: true
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom'
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });

                // Channel Performance Chart
                const channelCtx = document.getElementById('channelChart');
                if (this.charts.channel) {
                    this.charts.channel.destroy();
                }

                this.charts.channel = new Chart(channelCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Web Form', 'Chat', 'Audio'],
                        datasets: [{
                            data: [
                                data.surveys?.web_responses || 0,
                                data.surveys?.chat_responses || 0,
                                data.surveys?.audio_responses || 0
                            ],
                            backgroundColor: [
                                '#F5A623',
                                '#3B82F6', 
                                '#22C55E'
                            ]
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
            }

            updateUserFeedback(data) {
                const list = document.getElementById('userFeedbackList');
                
                if (!data.feedback_items || data.feedback_items.length === 0) {
                    list.innerHTML = `
                        <div class="loading">
                            <i class="fas fa-comment-slash"></i>
                            <p>No user feedback yet</p>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = data.feedback_items.map(item => `
                    <div class="feedback-item">
                        <div class="feedback-meta">
                            <span class="feedback-type ${item.feedback_type}">
                                ${this.getFeedbackIcon(item.feedback_type)} 
                                ${item.feedback_type.replace('_', ' ')}
                            </span>
                            <span class="feedback-date">${new Date(item.created_at).toLocaleDateString()}</span>
                        </div>
                        ${item.title ? `<div class="feedback-title">${item.title}</div>` : ''}
                        <div class="feedback-content">${item.description}</div>
                        ${item.rating ? `
                            <div class="feedback-rating">
                                <span class="star-rating">${'★'.repeat(item.rating)}${'☆'.repeat(5-item.rating)}</span>
                                <span style="font-size: 0.75rem; color: var(--text-muted);">${item.rating}/5</span>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            }

            updateExperienceData(data) {
                const list = document.getElementById('experienceFeedbackList');
                
                if (!data.recent_feedback || data.recent_feedback.length === 0) {
                    list.innerHTML = `
                        <div class="loading">
                            <i class="fas fa-smile-wink"></i>
                            <p>No experience feedback yet</p>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = data.recent_feedback.map(item => `
                    <div class="feedback-item">
                        <div class="feedback-meta">
                            <span class="feedback-type general">
                                <i class="fas fa-microphone"></i> ${item.survey_title}
                            </span>
                            <span class="feedback-date">${new Date(item.created_at).toLocaleDateString()}</span>
                        </div>
                        ${item.quick_feedback ? `<div class="feedback-content">${item.quick_feedback}</div>` : ''}
                        ${item.improvement_suggestion ? `<div class="feedback-content" style="margin-top: 8px; font-style: italic;">Suggestion: ${item.improvement_suggestion}</div>` : ''}
                        ${item.overall_rating ? `
                            <div class="feedback-rating">
                                <span class="star-rating">${'★'.repeat(item.overall_rating)}${'☆'.repeat(5-item.overall_rating)}</span>
                                <span style="font-size: 0.75rem; color: var(--text-muted);">${item.overall_rating}/5</span>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            }

            getFeedbackIcon(type) {
                const icons = {
                    bug: '<i class="fas fa-bug"></i>',
                    feature_request: '<i class="fas fa-lightbulb"></i>',
                    improvement: '<i class="fas fa-arrow-up"></i>',
                    general: '<i class="fas fa-comment"></i>'
                };
                return icons[type] || icons.general;
            }

            formatNumber(num) {
                if (num >= 1000000) {
                    return (num / 1000000).toFixed(1) + 'M';
                } else if (num >= 1000) {
                    return (num / 1000).toFixed(1) + 'K';
                }
                return num.toString();
            }

            calculateChange(current, previous) {
                if (!previous || previous === 0) {
                    return { text: 'No previous data', class: 'neutral', icon: 'minus' };
                }

                const change = ((current - previous) / previous * 100);
                
                if (change > 0) {
                    return { text: `+${change.toFixed(1)}%`, class: 'positive', icon: 'arrow-up' };
                } else if (change < 0) {
                    return { text: `${change.toFixed(1)}%`, class: 'negative', icon: 'arrow-down' };
                } else {
                    return { text: '0%', class: 'neutral', icon: 'minus' };
                }
            }

            showLoading() {
                document.getElementById('metricsGrid').innerHTML = `
                    <div class="loading" style="grid-column: 1 / -1;">
                        <i class="fas fa-spinner"></i>
                        <p>Loading analytics data...</p>
                    </div>
                `;
            }

            hideLoading() {
                // Loading is replaced by actual content
            }

            showError(message) {
                document.getElementById('metricsGrid').innerHTML = `
                    <div class="error-state" style="grid-column: 1 / -1;">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>${message}</p>
                        <button class="retry-btn" onclick="dashboard.loadDashboard()">Retry</button>
                    </div>
                `;
            }

            setupAutoRefresh() {
                // Refresh data every 5 minutes
                this.refreshInterval = setInterval(() => {
                    this.loadDashboard();
                }, 5 * 60 * 1000);
            }
        }

        // Global functions
        let dashboard;

        function refreshDashboard() {
            dashboard.loadDashboard();
        }

        function viewAllFeedback() {
            // Could open a detailed feedback modal or navigate to a dedicated page
            alert('Detailed feedback view coming soon!');
        }

        function viewAllExperience() {
